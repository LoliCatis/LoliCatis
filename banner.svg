<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
