    @keyframes up{from{opacity:0;transform:translateY(14px)}}
    .cur{animation:blink .9s step-end infinite}
    @keyframes blink{50%{opacity:0}}
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1640"/><stop offset=".55" stop-color="#5b3a86"/><stop offset="1" stop-color="#b07fc9"/>
    </linearGradient>
    <clipPath id="k0"><rect x="70" y="135" height="46" width="0"><animate attributeName="width" values="0;491;491;0;0" keyTimes="0;0.1;0.28;0.32;1" dur="12s" begin="0s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="k1"><rect x="70" y="135" height="46" width="0"><animate attributeName="width" values="0;419;419;0;0" keyTimes="0;0.1;0.28;0.32;1" dur="12s" begin="4s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="k2"><rect x="70" y="135" height="46" width="0"><animate attributeName="width" values="0;454;454;0;0" keyTimes="0;0.1;0.28;0.32;1" dur="12s" begin="8s" repeatCount="indefinite"/></rect></clipPath>
    
