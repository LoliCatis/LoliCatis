  <rect x="74" y="141" width="3" height="32" rx="1.5" fill="#f3e8ff" opacity="0"><animate attributeName="opacity" values="1;0" keyTimes="0;0.333" calcMode="discrete" dur="12s" begin="4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0;417;417;0;0" keyTimes="0;0.1;0.28;0.32;1" dur="12s" begin="4s" repeatCount="indefinite"/></rect>
