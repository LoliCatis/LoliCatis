  <rect class="bg" width="1200" height="240" rx="18" fill="url(#g)"/>
  <circle class="s" cx="980" cy="60" r="3"/><circle class="s" cx="1060" cy="150" r="2" style="animation-delay:.7s"/>
  <circle class="s" cx="900" cy="190" r="2.5" style="animation-delay:1.4s"/><circle class="s" cx="1130" cy="70" r="2" style="animation-delay:2.1s"/>
  <circle class="s" cx="820" cy="45" r="2" style="animation-delay:1s"/><circle class="s" cx="1110" cy="200" r="2.5" style="animation-delay:2.5s"/>
  <text class="t name" x="70" y="112" font-size="64" font-weight="700" fill="#fff">LoliCat</text>
